name: reservalab

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Servicio de notificaciones simulado
  mockoon:
    image: mockoon/cli:9.9.0
    restart: unless-stopped
    command: ["--data", "/data/notifications.json", "--port", "3001", "--log-transaction"]
    ports:
      - "${NOTIFICATIONS_PORT:-3001}:3001"
    volumes:
      - ./packages/mocks/notifications.json:/data/notifications.json:ro

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    # Dentro de la red de Docker los servicios se llaman por su nombre, no por localhost.
    # Estas variables reemplazan a las de .env, que apuntan a los puertos publicados en el host.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://redis:6379
      NOTIFICATIONS_URL: http://mockoon:3001
      API_PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mockoon:
        condition: service_started

volumes:
  postgres-data:

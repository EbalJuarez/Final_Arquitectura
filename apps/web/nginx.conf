# La web y la API comparten origen: el navegador llama a /api/... y nginx lo reenvía al servicio api
# de docker compose, así que no hace falta CORS.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://api:3000;
    # Con la API caída, responder 502 enseguida en vez de esperar 60 s a conectar
    proxy_connect_timeout 5s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Archivos con hash en el nombre: se pueden guardar en caché para siempre
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html sin caché, para que un despliegue nuevo se vea de inmediato
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
